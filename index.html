<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f1e7d8">
  <meta name="description" content="UX Portfolio project">
  <meta name="keywords" content="UX, Design, Designer, Portfolio">
  <meta name="author" content="Mathieu Nauleau">

  <title>Oh, hello.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --paper: #f1e7d8;
      --ink: #1d3d3a;
      --muted: #647568;
      --card: #fffefa;
    }

    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      padding: 32px 24px;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(100%, 520px);
    }

    .box {
      padding: clamp(28px, 7vw, 56px);
      border-radius: 30px;
      background: var(--card);
      box-shadow: 0 16px 36px rgb(46 51 39 / 8%);
    }

    h1 {
      margin: 0 0 28px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2rem, 6vw, 2.6rem);
      font-weight: 500;
      letter-spacing: -0.035em;
      line-height: 1.12;
    }

    input {
      width: 100%;
      min-height: 54px;
      padding: 0 16px;
      border: 1px solid #d7ddd4;
      border-radius: 12px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
    }

    input::placeholder {
      color: var(--muted);
      opacity: 1;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #55786b;
      outline-offset: 3px;
    }

    button {
      display: inline-flex;
      min-height: 48px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 16px;
      padding: 0 22px;
      border: 0;
      border-radius: 999px;
      background: var(--ink);
      color: var(--card);
      cursor: pointer;
      font: inherit;
      font-weight: 600;
      transition: transform 180ms ease, background-color 180ms ease;
    }

    button:hover {
      transform: translateY(-2px);
      background: #294d48;
    }

    #wrongPassword {
      margin: 16px 0 0;
      color: var(--muted);
    }

    @media (max-width: 640px) {
      body {
        padding: 24px 20px;
      }

      .box {
        border-radius: 26px;
      }
    }

    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main>
    <section class="box" aria-labelledby="page-title">
      <h1 id="page-title">Eh oh, qui va là ?</h1>
      <input id="password" type="password" size="20" maxlength="20" placeholder="Enter password" aria-label="Password"
        autocomplete="current-password">
      <button id="loginbutton" type="button">
        <span data-i18n="btn.contact">Submit</span>
        <span aria-hidden="true">→</span>
      </button>
      <p id="wrongPassword" style="display: none">wrong password</p>
    </section>
  </main>

  <script type="text/javascript" src="https://code.jquery.com/jquery-1.12.0.min.js"></script>

  <script type="text/javascript"
    src="https://rawcdn.githack.com/chrisveness/crypto/7067ee62f18c76dd4a9d372a00e647205460b62b/sha1.js"></script>

  <script type="text/javascript">
    "use strict";

    function loadPage(pwd) {
      var hash = pwd;
      hash = Sha1.hash(pwd);
      var url = hash + "/index.html";

      $.ajax({
        url: url,
        dataType: "html",
        success: function (data) {
          window.location = url;
        },
        error: function (xhr, ajaxOptions, thrownError) {
          parent.location.hash = hash;

          //$("#wrongPassword").show();
          $("#password").attr("placeholder", "wrong password");
          $("#password").val("");
        },
      });
    }

    $("#loginbutton").on("click", function () {
      loadPage($("#password").val());
    });
    $("#password").keypress(function (e) {
      if (e.which == 13) {
        loadPage($("#password").val());
      }
    });
    $("#password").focus();
  </script>
</body>

</html>
